<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc">
  <title id="title">FableApps social preview</title>
  <desc id="desc">FableApps - Software to Simplify Life</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#EEF4FF"/>
      <stop offset="1" stop-color="#E6EEF9"/>
    </linearGradient>
    <radialGradient id="orbBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 110) rotate(54) scale(255 215)">
      <stop stop-color="#66A8FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#66A8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(972 96) rotate(20) scale(190 150)">
      <stop stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGreen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1004 516) rotate(-24) scale(220 180)">
      <stop stop-color="#34C759" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#34C759" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="152" y1="104" x2="1048" y2="548" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.9"/>
      <stop offset="1" stop-color="white" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="shadow" x="112" y="86" width="976" height="486" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="16"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.0509804 0 0 0 0 0.101961 0 0 0 0 0.196078 0 0 0 0.16 0"/>
      <feBlend mode="normal" in2="BackgroundImageFix" result="effect1_dropShadow"/>
      <feBlend mode="normal" in="SourceGraphic" in2="effect1_dropShadow" result="shape"/>
    </filter>
    <filter id="softBlur" x="0" y="0" width="1200" height="630" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orbBlue)"/>
  <rect width="1200" height="630" fill="url(#orbViolet)"/>
  <rect width="1200" height="630" fill="url(#orbGreen)"/>

  <g opacity="0.42">
    <path d="M0 100H1200" stroke="#D3DDEB" stroke-dasharray="2 14"/>
    <path d="M0 524H1200" stroke="#D3DDEB" stroke-dasharray="2 14"/>
  </g>

  <path d="M0 466C184 428 320 452 456 470C612 490 736 492 860 462C980 433 1090 420 1200 438V630H0V466Z" fill="#DCE8F8" fill-opacity="0.34" filter="url(#softBlur)"/>

  <rect x="124" y="92" width="952" height="446" rx="46" fill="url(#card)" stroke="rgba(15,23,42,0.08)" filter="url(#shadow)"/>

  <g transform="translate(600 315)">
    <!-- Centered Image Logo -->
    <image href="fa-logo.png" xlink:href="fa-logo.png" x="-40" y="-185" width="80" height="80" preserveAspectRatio="xMidYMid meet" />
    
    <!-- Massive Centered Title -->
    <text x="0" y="-5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="80" font-weight="800" letter-spacing="-0.04em" fill="#0F172A">FableApps</text>

    <!-- Subtitle -->
    <text x="0" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="36" font-weight="600" fill="#475569">Software to <tspan fill="#0071E3">Simplify</tspan> Life.</text>
    
    <!-- Divider -->
    <rect x="-30" y="95" width="60" height="4" rx="2" fill="#DCE8F8"/>
    
    <!-- Description -->
    <text x="0" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#64748B">We build simple, reliable software to help you</text>
    <text x="0" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#64748B">stay organized and focus on what matters.</text>
  </g>
</svg>
